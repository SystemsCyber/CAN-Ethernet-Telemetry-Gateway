; CAN-Ethernet Telemetry Gateway
; Teensy 4.1 — QNEthernet + mbed TLS + ArduinoJson

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Library dependencies
lib_deps =
    ssilverman/QNEthernet @ ^0.29.0
    bblanchon/ArduinoJson @ ^7.3.0
    ; ---------------------------------------------------------
    ; mbed TLS: No turnkey PlatformIO library exists for Teensy.
    ; Recommended approach — pick ONE:
    ;
    ;   1. Clone https://github.com/Mbed-TLS/mbedtls (tag v3.6.x)
    ;      into this project's lib/mbedtls/ folder and add a small
    ;      library.json so PlatformIO picks it up.
    ;
    ;   2. Use an Arduino-ported fork such as
    ;      https://github.com/ark-v/arduino-mbedtls
    ;      (copy into lib/ or add as lib_deps if published).
    ;
    ; Once the mbedtls sources are visible to the build, the
    ; #include paths in main.cpp will resolve.
    ; ---------------------------------------------------------

; Build flags
build_flags =
    -D ARDUINO
    -D MBEDTLS_CONFIG_FILE=\"mbedtls_config.h\"   ; only if you supply a custom config
    -Wall
